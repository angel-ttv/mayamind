<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayamind — Tu circuito en la Riviera Maya</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f2a2e; color: #f2f7f5; padding: 20px 14px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 2rem; text-align: center; }
  h1 span { color: #4ade80; }
  .sub { text-align: center; color: #9fc3bb; margin: 8px 0 28px; }
  .card { background: #173d41; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  h2 { font-size: 1.05rem; margin-bottom: 14px; color: #4ade80; }
  .gusto { margin-bottom: 14px; }
  .gusto label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .gusto label b { color: #4ade80; }
  input[type=range] { width: 100%; accent-color: #4ade80; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field label { display: block; font-size: .85rem; color: #9fc3bb; margin-bottom: 4px; }
  .field select, .field input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #2a5a5e; background: #0f2a2e; color: #f2f7f5; font-size: 1rem; }
  button { width: 100%; padding: 15px; border: none; border-radius: 12px; background: #4ade80; color: #0f2a2e; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
  button:disabled { opacity: .6; }
  #resultado { margin-top: 8px; }
  .guia { background: #1d4d33; border-left: 4px solid #4ade80; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
  .guia b { color: #4ade80; }
  .dia h2 { color: #f2f7f5; }
  .parada { background: #0f2a2e; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .parada .momento { display: inline-block; font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; background: #4ade80; color: #0f2a2e; border-radius: 999px; padding: 3px 10px; margin-bottom: 6px; }
  .parada h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .parada p { color: #b9d6cf; font-size: .92rem; line-height: 1.45; }
  .parada .meta { font-size: .82rem; color: #7fb3a8; margin-top: 8px; }
  .parada a { display: inline-block; margin-top: 10px; color: #4ade80; font-weight: 700; text-decoration: none; }
  iframe { width: 100%; height: 260px; border: 0; border-radius: 12px; margin-top: 10px; }
  .vacio { text-align: center; color: #9fc3bb; padding: 30px 10px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌴 Maya<span>mind</span></h1>
  <p class="sub">Dime qué te gusta y te armo tu circuito por la Riviera Maya, día por día.</p>

  <div class="card">
    <h2>1 · ¿Qué te gusta? (0 = nada, 5 = muchísimo)</h2>
    <div id="gustos"></div>
  </div>

  <div class="card">
    <h2>2 · Tu viaje</h2>
    <div class="grid">
      <div class="field">
        <label>Presupuesto</label>
        <select id="presupuesto">
          <option value="1">Económico</option>
          <option value="2" selected>Medio</option>
          <option value="3">Premium</option>
        </select>
      </div>
      <div class="field">
        <label>Días</label>
        <select id="dias">
          <option value="1">1 día</option>
          <option value="2">2 días</option>
          <option value="3" selected>3 días</option>
          <option value="4">4 días</option>
          <option value="5">5 días</option>
        </select>
      </div>
      <div class="field">
        <label>¿Con quién viajas?</label>
        <select id="acompanantes">
          <option value="solo">Solo/a</option>
          <option value="pareja" selected>En pareja</option>
          <option value="familia">En familia</option>
          <option value="amigos">Con amigos</option>
        </select>
      </div>
      <div class="field">
        <label>Ritmo</label>
        <select id="ritmo">
          <option value="tranquilo">Tranquilo (2 cosas al día)</option>
          <option value="moderado" selected>Moderado (3 cosas al día)</option>
          <option value="intenso">Intenso (4 cosas al día)</option>
        </select>
      </div>
    </div>
  </div>

  <button id="armar" onclick="armar()">Armar mi circuito →</button>
  <div id="resultado"></div>
</div>

<script>
const GUSTOS = {{ gustos | tojson }};
const NOMBRES = {{ nombres | tojson }};

const cont = document.getElementById('gustos');
GUSTOS.forEach(g => {
  const div = document.createElement('div');
  div.className = 'gusto';
  div.innerHTML = `<label><span>${NOMBRES[g][0].toUpperCase() + NOMBRES[g].slice(1)}</span><b id="v-${g}">3</b></label>
    <input type="range" min="0" max="5" value="3" id="g-${g}"
      oninput="document.getElementById('v-${g}').textContent = this.value">`;
  cont.appendChild(div);
});

async function armar() {
  const gustos = {};
  GUSTOS.forEach(g => gustos[g] = parseInt(document.getElementById('g-' + g).value, 10));
  const body = {
    gustos,
    presupuesto: parseInt(document.getElementById('presupuesto').value, 10),
    dias: parseInt(document.getElementById('dias').value, 10),
    acompanantes: document.getElementById('acompanantes').value,
    ritmo: document.getElementById('ritmo').value,
  };
  const btn = document.getElementById('armar');
  const res = document.getElementById('resultado');
  btn.disabled = true;
  btn.textContent = 'Armando tu circuito…';
  res.innerHTML = '';
  try {
    const r = await fetch('/recomendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    render(data);
  } catch (e) {
    res.innerHTML = '<p class="vacio">No se pudo armar el circuito. Revisa que el servidor esté corriendo.</p>';
  }
  btn.disabled = false;
  btn.textContent = 'Armar mi circuito →';
}

function render(data) {
  const res = document.getElementById('resultado');
  if (!data.circuito || !data.circuito.length) {
    res.innerHTML = '<p class="vacio">Con esos gustos y ese presupuesto no salió nada. Sube el presupuesto o baja un poco la exigencia.</p>';
    return;
  }
  const MOM = { manana: 'Mañana', tarde: 'Tarde', noche: 'Noche', dia: 'Día completo' };
  let html = `<div class="guia"><b>${data.guia.nombre}</b> · tu guía<br>${data.mensaje_guia}</div>`;
  const dias = {};
  data.circuito.forEach(p => { (dias[p.dia] = dias[p.dia] || []).push(p); });
  Object.keys(dias).sort((a, b) => a - b).forEach(d => {
    html += `<div class="card dia"><h2>Día ${d}</h2>`;
    dias[d].forEach(p => {
      html += `<div class="parada">
        <span class="momento">${MOM[p.momento] || p.momento}</span>
        <h3>${p.nombre}</h3>
        <p>${p.descripcion}</p>
        <div class="meta">📍 ${p.ubicacion} · ⏱ ${p.duracion_horas} h · ${p.categoria}</div>
        <a href="${p.maps_link}" target="_blank" rel="noopener">Cómo llegar →</a>
      </div>`;
    });
    if (data.mapas_por_dia && data.mapas_por_dia[d]) {
      html += `<iframe src="${data.mapas_por_dia[d]}" loading="lazy"></iframe>`;
    }
    html += '</div>';
  });
  res.innerHTML = html;
  res.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
